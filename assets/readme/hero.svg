<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">aibot-wecom 企业微信智能机器人 Relay</title>
  <desc id="desc">企业微信消息经官方 WebSocket 进入本地 Relay，携带不透明 replyContext 交给 skill，最终结果安全返回原会话。</desc>

  <rect width="1200" height="400" rx="20" fill="#F5F7FA"/>
  <rect width="690" height="400" rx="20" fill="#1F2933"/>
  <rect x="670" width="20" height="400" fill="#1F2933"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <text x="64" y="72" font-size="18" font-weight="700" letter-spacing="2.4" fill="#9FB3C8">WECOM · WEBSOCKET · LOCAL RELAY</text>
    <text x="64" y="157" font-size="66" font-weight="800" letter-spacing="-1.5" fill="#F5F7FA">aibot-wecom</text>
    <rect x="64" y="187" width="72" height="6" rx="3" fill="#5C7FA3"/>
    <text x="64" y="244" font-size="29" font-weight="500" fill="#D9E2EC">把 skill 的结果，送回</text>
    <text x="64" y="286" font-size="29" font-weight="500" fill="#D9E2EC">发起任务的企业微信原会话</text>
    <text x="64" y="345" font-size="18" font-weight="500" fill="#9FB3C8">Python 3.10+  ·  官方 SDK  ·  本机鉴权 IPC</text>
  </g>

  <g id="relay-flow" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <text x="754" y="65" font-size="18" font-weight="700" letter-spacing="2" fill="#52606D">ONE MESSAGE · ONE FINAL KEY</text>
    <rect x="754" y="93" width="350" height="60" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="784" cy="123" r="8" fill="#3D5A80"/>
    <text x="808" y="130" font-size="22" font-weight="650" fill="#1F2933">企业微信用户消息</text>
    <path d="M929 153 V184" stroke="#7B8794" stroke-width="3"/>
    <path d="M921 177 L929 187 L937 177" fill="none" stroke="#7B8794" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="728" y="188" width="402" height="78" rx="14" fill="#3D5A80"/>
    <text x="754" y="220" font-size="18" font-weight="700" letter-spacing="1.5" fill="#D9E2EC">RELAY BOUNDARY</text>
    <text x="754" y="249" font-size="22" font-weight="650" fill="#FFFFFF">去重 · TTL · 幂等 · 投递裁决</text>
    <path d="M929 266 V297" stroke="#7B8794" stroke-width="3"/>
    <path d="M921 290 L929 300 L937 290" fill="none" stroke="#7B8794" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="754" y="301" width="350" height="52" rx="12" fill="#E7EDF4" stroke="#B8C7D9" stroke-width="2"/>
    <text x="779" y="334" font-size="20" font-weight="650" fill="#1F2933">replyContext  →  final reply</text>
    <text x="754" y="380" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" fill="#52606D">unknown = terminal · never retry</text>
  </g>
</svg>
