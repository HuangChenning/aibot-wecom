[project]
name = "wecom-aibot"
version = "0.1.0"
description = "Enterprise WeChat smart bot relay"
requires-python = ">=3.10"
dependencies = [
    "packaging",
    "wecom-aibot-python-sdk==1.0.2",
]

[project.scripts]
wecom-aibot = "wecom_aibot.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wecom_aibot"]

[tool.ruff]
exclude = [".github"]
